.hero .stop span{top:-22px}.hero .stop small{top:16px}.hero .stop.l0 span,.hero .stop.l0 small{left:0;transform:none}.hero .stop.l1 span,.hero .stop.l1 small{left:auto;right:0;transform:none}.hero .stop.on span{color:var(--acc);font-weight:700}.hero .stop.l0 span,.hero .stop.l1 span{display:none}.hero .track{margin-top:28px}

.g2,.g3{gap:10px}.g2>*,.g3>*{min-width:0}

<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var K="subway-pay-v1",RANKS=["이병","일병","상병","병장"];
function def(){return{start:"",end:"",promo:{"일병":"","상병":"","병장":""},pay:{"이병":0,"일병":0,"상병":0,"병장":0},meal:0,trans:0,extras:[],annual:0,
types:[{n:"연가",a:true,x:false},{n:"병가",a:false,x:false},{n:"공가",a:false,x:false},{n:"특별휴가",a:false,x:false}],leaves:[]}}
function load(){try{var r=localStorage.getItem(K);if(r){var o=JSON.parse(r),d=def();return Object.assign(d,o)}}catch(e){}return def()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var S=load(),tab="home",ym=ymOf(new Date());
function ymOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function pd(s){if(!s)return null;var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function won(n){return Math.round(n).toLocaleString("ko-KR")+"원"}
function fd(d){return d?d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate():"-"}
function rankAt(d){var r="이병";["일병","상병","병장"].forEach(function(k){var p=pd(S.promo[k]);if(p&&d>=p)r=k});return r}
function leaveType(n){return S.types.filter(function(t){return t.n===n})[0]||{}}
function usedAnnual(){return S.leaves.reduce(function(s,l){return s+(leaveType(l.type).a?+l.days:0)},0)}
function calcMonth(y){var a=y.split("-"),Y=+a[0],M=+a[1]-1,n=new Date(Y,M+1,0).getDate(),wd=0;
for(var i=1;i<=n;i++){var g=new Date(Y,M,i).getDay();if(g>0&&g<6)wd++}
var ex=S.leaves.reduce(function(s,l){var d=pd(l.date);return s+(d&&ymOf(d)===y&&leaveType(l.type).x?+l.days:0)},0);
var days=Math.max(0,wd-ex),rank=rankAt(new Date(Y,M,1)),base=+S.pay[rank]||0,meal=(+S.meal||0)*days,tr=(+S.trans||0)*days,
extras=S.extras.reduce(function(s,e){return s+(+e.amt||0)},0);
return{wd:wd,ex:ex,days:days,rank:rank,base:base,meal:meal,tr:tr,extras:extras,total:base+meal+tr+extras}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function home(){var s=pd(S.start),e=pd(S.end),t=today();
if(!s||!e||e<s)return '<h1>사회복무요원 복무 현황</h1><div class="card"><div class="empty">설정 탭에서 복무 시작일과 소집해제일을 입력하세요.</div></div>';
var tot=Math.round((e-s)/864e5)+1,done=Math.min(tot,Math.max(0,Math.round((t-s)/864e5)+1)),pct=done/tot*100,left=tot-done,r=rankAt(t);
var stops=[["입소",s,0]];["일병","상병","병장"].forEach(function(k){var p=pd(S.promo[k]);if(p&&p>=s&&p<=e)stops.push([k,p,(Math.round((p-s)/864e5))/tot*100])});stops.push(["해제",e,100]);
var st=stops.map(function(x){return '<div class="stop'+(t>=x[1]?' on':'')+(x[2]<=0?' l0':x[2]>=100?' l1':'')+'" style="left:'+x[2]+'%"><span>'+x[0]+'</span><small>'+(x[1].getMonth()+1)+'/'+x[1].getDate()+'</small></div>'}).join("");
var nx=null;["일병","상병","병장"].forEach(function(k){var p=pd(S.promo[k]);if(p&&p>t&&!nx)nx=[k,p]});
var m=calcMonth(ymOf(t)),rem=(+S.annual||0)-usedAnnual();
return '<h1>사회복무요원 복무 현황</h1><div class="card hero"><div class="sub">복무율</div><div class="big">'+pct.toFixed(2)+'%</div>'
+'<div class="track"><div class="fill" style="width:'+pct+'%"></div>'+st+'<div class="train" style="left:'+pct+'%"></div></div>'
+'<div class="row"><span>현재 계급</span><b>'+r+'</b></div><div class="row"><span>복무한 날</span><b>'+done+'일 / '+tot+'일</b></div>'
+'<div class="row"><span>남은 날</span><b>'+left+'일</b></div>'
+'<div class="row"><span>다음 진급</span><b>'+(nx?nx[0]+' · '+fd(nx[1])+' ('+Math.round((nx[1]-t)/864e5)+'일 후)':'-')+'</b></div></div>'
+'<div class="card"><h2>이번 달 예상 월급</h2><div class="big" style="font-size:32px">'+won(m.total)+'</div><div class="sub">'+m.rank+' 기준 · 근무일 '+m.days+'일</div></div>'
+'<div class="card"><h2>남은 연가</h2><div class="big" style="font-size:32px">'+(Math.round(rem*10)/10)+'일</div><div class="sub">총 '+(+S.annual||0)+'일 중 '+usedAnnual()+'일 사용</div></div>'}

function pay(){var m=calcMonth(ym);
return '<h1>월급 계산</h1><div class="card"><label for="ym" style="margin-top:0">계산할 달</label><input id="ym" type="month" value="'+ym+'" onchange="ym=this.value||ym;render()"></div>'
+'<div class="card"><h2>'+ym.replace("-","년 ")+'월 · '+m.rank+'</h2>'
+'<div class="row"><span>기본급</span><b>'+won(m.base)+'</b></div>'
+'<div class="row"><span>식비 <span class="sub">('+m.days+'일)</span></span><b>'+won(m.meal)+'</b></div>'
+'<div class="row"><span>교통비 <span class="sub">('+m.days+'일)</span></span><b>'+won(m.tr)+'</b></div>'
+S.extras.map(function(e){return '<div class="row"><span>'+esc(e.name||"수당")+'</span><b>'+won(+e.amt||0)+'</b></div>'}).join("")
+'<div class="total"><span>합계</span><span>'+won(m.total)+'</span></div>'
+'<div class="note">평일 '+m.wd+'일 중 식비·교통비 제외 휴가 '+m.ex+'일을 뺐어요. 계급은 해당 월 1일 기준이에요.</div></div>'}

function leaves(){var rem=(+S.annual||0)-usedAnnual(),opts=S.types.map(function(t){return '<option>'+esc(t.n)+'</option>'}).join("");
var list=S.leaves.map(function(l,i){return {l:l,i:i}}).sort(function(a,b){return a.l.date<b.l.date?1:-1}).map(function(o){
return '<div class="row"><span>'+o.l.date+' <span class="pill">'+esc(o.l.type)+'</span> '+o.l.days+'일</span><button class="ghost" onclick="delLeave('+o.i+')" aria-label="휴가 삭제">삭제</button></div>'}).join("");
return '<h1>휴가 관리</h1><div class="card"><div class="sub">남은 연가</div><div class="big">'+(Math.round(rem*10)/10)+'일</div><div class="sub">총 '+(+S.annual||0)+'일 중 '+usedAnnual()+'일 사용</div></div>'
+'<div class="card"><h2>휴가 등록</h2><label for="ld" style="margin-top:0">날짜</label><input id="ld" type="date" value="'+dstr(today())+'">'
+'<div class="g2"><div><label for="lt">종류</label><select id="lt">'+opts+'</select></div><div><label for="ln">일수</label><input id="ln" type="number" inputmode="decimal" step="0.5" min="0.5" value="1"></div></div>'
+'<button class="btn" onclick="addLeave()">휴가 등록</button></div>'
+'<div class="card"><h2>사용 내역</h2>'+(list||'<div class="empty">아직 등록한 휴가가 없어요.</div>')+'</div>'}
function addLeave(){var d=document.getElementById("ld").value,t=document.getElementById("lt").value,n=parseFloat(document.getElementById("ln").value);
if(!d||!(n>0))return;S.leaves.push({date:d,type:t,days:n});save();render()}
function delLeave(i){S.leaves.splice(i,1);save();render()}

function numIn(id,lab,val,fn){return '<div><label for="'+id+'">'+lab+'</label><input id="'+id+'" type="number" inputmode="numeric" min="0" value="'+(+val||0)+'" onchange="'+fn+'"></div>'}
function settings(){
var promo=["일병","상병","병장"].map(function(k){return '<div><label for="p'+k+'">'+k+' 진급일</label><input id="p'+k+'" type="date" value="'+S.promo[k]+'" onchange="S.promo[\''+k+'\']=this.value;save()"></div>'}).join("");
var pays=RANKS.map(function(k){return numIn("b"+k,k+" 기본급(월)",S.pay[k],"S.pay['"+k+"']=+this.value;save()")}).join("");
var ex=S.extras.map(function(e,i){return '<div class="g2" style="grid-template-columns:1fr 1fr auto;align-items:end"><div><label for="en'+i+'">수당 이름</label><input id="en'+i+'" value="'+esc(e.name)+'" onchange="S.extras['+i+'].name=this.value;save()"></div>'
+'<div><label for="ea'+i+'">월 금액</label><input id="ea'+i+'" type="number" inputmode="numeric" min="0" value="'+(+e.amt||0)+'" onchange="S.extras['+i+'].amt=+this.value;save()"></div>'
+'<button class="ghost" onclick="S.extras.splice('+i+',1);save();render()" aria-label="수당 삭제">삭제</button></div>'}).join("");
var ty=S.types.map(function(t,i){return '<div class="row"><b>'+esc(t.n)+'</b><span style="display:flex;gap:14px"><label class="chk" style="margin:0"><input type="checkbox" '+(t.a?'checked':'')+' onchange="S.types['+i+'].a=this.checked;save()">연가 차감</label>'
+'<label class="chk" style="margin:0"><input type="checkbox" '+(t.x?'checked':'')+' onchange="S.types['+i+'].x=this.checked;save()">식비·교통비 제외</label></span></div>'}).join("");
return '<h1>설정</h1><div class="card"><h2>복무 기간</h2><div class="g2"><div><label for="s0" style="margin-top:0">복무 시작일</label><input id="s0" type="date" value="'+S.start+'" onchange="S.start=this.value;save()"></div>'
+'<div><label for="s1" style="margin-top:0">소집해제일</label><input id="s1" type="date" value="'+S.end+'" onchange="S.end=this.value;save()"></div></div>'
+'<div class="g3">'+promo+'</div></div>'
+'<div class="card"><h2>월급 금액</h2><div class="sub">실제 급여명세서나 복무기관 안내에 맞게 직접 입력하세요.</div><div class="g2">'+pays+'</div>'
+'<div class="g2">'+numIn("meal","식비(1일)",S.meal,"S.meal=+this.value;save()")+numIn("trans","교통비(1일)",S.trans,"S.trans=+this.value;save()")+'</div></div>'
+'<div class="card"><h2>추가 수당</h2><div class="sub">야간·주말·교대근무 등 지하철 근무 수당을 월 고정액으로 넣을 수 있어요.</div>'+ex
+'<button class="btn" style="background:none;color:var(--acc);border:1px solid var(--acc)" onclick="S.extras.push({name:\'\',amt:0});save();render()">수당 추가</button></div>'
