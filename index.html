<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00a651">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="복무계산기">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>지하철 복무 월급 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16211c;--sub:#68736d;--line:#dfe5e1;--acc:#00a651;--acc-ink:#fff;--soft:#e4f4ea;--warn:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--card:#1a2420;--ink:#eaf1ed;--sub:#93a199;--line:#2b3832;--acc:#2ecc79;--acc-ink:#07130c;--soft:#1d3427;--warn:#fb923c}}
:root[data-theme="dark"]{--bg:#111815;--card:#1a2420;--ink:#eaf1ed;--sub:#93a199;--line:#2b3832;--acc:#2ecc79;--acc-ink:#07130c;--soft:#1d3427;--warn:#fb923c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:20px;font-weight:900;margin:4px 0 14px}
h2{font-size:15px;font-weight:700;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.hero{padding:18px 16px 20px}
.big{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1.1}
.sub{color:var(--sub);font-size:13px}
.track{position:relative;height:6px;background:var(--line);border-radius:3px;margin:34px 6px 28px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:3px}
.stop{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--card);border:3px solid var(--line)}
.stop.on{border-color:var(--acc)}
.stop span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--sub);white-space:nowrap}
.stop small{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--sub);white-space:nowrap}
.train{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--acc);border:3px solid var(--card);box-shadow:0 0 0 1px var(--acc)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{font-weight:700;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:4px;border-top:2px solid var(--ink);font-weight:900;font-size:20px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:11px 16px;font-weight:700;min-height:44px;width:100%;margin-top:12px}
.ghost{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:6px 10px;min-height:36px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--sub);padding:10px 0;font-weight:500;font-size:14px;border-radius:10px;min-height:44px}
nav button[aria-current="true"]{color:var(--acc);font-weight:900;background:var(--soft)}
.pill{display:inline-block;background:var(--soft);color:var(--acc);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin:0}
.chk input{width:18px;height:18px;min-height:0}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:12px 0}
.note{font-size:12px;color:var(--sub);margin-top:10px}
.sh{display:block;border-radius:8px;padding:7px 0;font-size:13px;font-weight:700;background:var(--bg);color:var(--sub)}.sh.w{background:var(--soft);color:var(--acc)}.strip{display:flex;gap:6px;margin-top:12px}.strip>div{flex:1;text-align:center}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dw{text-align:center;font-size:12px}.cd{min-height:60px;border:0;border-radius:10px;background:var(--bg);color:var(--ink);padding:5px 0 4px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:0}.cd b{font-size:14px}.cd i{font-style:normal;font-size:10px;font-weight:700;white-space:nowrap}.cd u{text-decoration:none;font-size:9px;color:var(--acc);white-space:nowrap}.cd.off{opacity:.3;cursor:default}.cd.sel{outline:2px solid var(--acc)}.cd.td b{text-decoration:underline}.cd.hol b{color:#e5604f}.s0 i{color:#4f7cf3}.s1 i{color:#8b6df0}.s2 i{color:var(--sub)}.s3 i{color:#2f9e63}.lv i{color:#d9822b}.tr i{color:#8a8f3a}details summary{cursor:pointer;margin-bottom:8px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}.sh-in{pointer-events:auto;width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);max-height:78vh;overflow:auto}.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}.og{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ob{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;min-height:44px;padding:8px 2px;font-size:13px;font-weight:700}.ob.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.place{font-weight:700;font-size:14px;color:var(--acc)}.badge{display:inline-block;background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:2px 10px;font-weight:900;font-size:15px}.bigp{font-size:clamp(30px,10vw,44px);font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.stat{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}.stat .k{font-size:12px;color:var(--sub)}.stat .v{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ta{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;word-break:break-all}.msg{font-size:13px;color:var(--acc);font-weight:700;margin-top:10px}.btn.line{background:none;color:var(--acc);border:1px solid var(--acc)}.btn.danger{background:none;color:var(--warn);border:1px solid var(--warn)}
.hl{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:6px;flex-wrap:wrap}.dp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}.dp b{font-size:24px;font-weight:900}.dp span{font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}.tri{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:12px;padding:12px 0;text-align:center}.tri>div{border-left:1px solid var(--line);min-width:0}.tri>div:first-child{border-left:0}.tri .k{font-size:12px;color:var(--sub)}.tri .v{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;text-align:center}.mnav .ghost{min-width:44px;min-height:44px;font-size:22px;border:0}.mamt{font-size:clamp(26px,8.5vw,36px);font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.2}.mamt small{font-size:.5em;font-weight:500;color:var(--sub);margin-left:4px}.svr{display:flex;justify-content:space-between;align-items:center;gap:10px}.svr b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.cd.lv i,.cd.tr i{color:var(--lc,#d9822b)}.cd i{max-width:100%;overflow:hidden;text-overflow:clip}.lg{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:12px;font-size:12px;color:var(--sub)}.lg span{display:inline-flex;align-items:center;gap:4px}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px}.neg{color:var(--warn)}
.hero .track{height:12px;border-radius:6px;margin:30px 0 30px;background:var(--line);overflow:visible}.hero .fill{border-radius:6px}.hero .train{display:none}
.hero .stop{width:2px;height:12px;margin:0 0 0 -1px;top:0;border:0;border-radius:0;background:var(--sub);opacity:.45}.hero .stop.on{background:var(--card);opacity:.9}.hero .stop.l0,.hero .stop.l1{background:none}
.hero .stop span{top:-22px}.hero .stop small{top:16px}.hero .stop.l0 span,.hero .stop.l0 small{left:0;transform:none}.hero .stop.l1 span,.hero .stop.l1 small{left:auto;right:0;transform:none}.hero .stop.on span{color:var(--acc);font-weight:700}.hero .stop.l0 span,.hero .stop.l1 span{display:none}.hero .track{margin-top:28px}
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}button,nav{-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var K="subway-pay-v1",RANKS=["이병","일병","상병","병장"];
function def(){return{start:"",end:"",promo:{"일병":"","상병":"","병장":""},pay:{"이병":0,"일병":0,"상병":0,"병장":0},meal:0,trans:0,extras:[],annual:0,
types:[{n:"연가",a:true,x:false},{n:"병가",a:false,x:false},{n:"공가",a:false,x:false},{n:"특별휴가",a:false,x:false}],leaves:[]}}
function load(){try{var r=localStorage.getItem(K);if(r){var o=JSON.parse(r),d=def();return Object.assign(d,o)}}catch(e){}return def()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var S=load(),tab="home",ym=ymOf(new Date());
function ymOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function pd(s){if(!s)return null;var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function won(n){return Math.round(n).toLocaleString("ko-KR")+"원"}
function fd(d){return d?d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate():"-"}
function rankAt(d){var r="이병";["일병","상병","병장"].forEach(function(k){var p=pd(S.promo[k]);if(p&&d>=p)r=k});return r}
function leaveType(n){return S.types.filter(function(t){return t.n===n})[0]||{}}
function usedAnnual(){return S.leaves.reduce(function(s,l){return s+(leaveType(l.type).a?+l.days:0)},0)}
function calcMonth(y){var a=y.split("-"),Y=+a[0],M=+a[1]-1,n=new Date(Y,M+1,0).getDate(),wd=0;
for(var i=1;i<=n;i++){var g=new Date(Y,M,i).getDay();if(g>0&&g<6)wd++}
var ex=S.leaves.reduce(function(s,l){var d=pd(l.date);return s+(d&&ymOf(d)===y&&leaveType(l.type).x?+l.days:0)},0);
var days=Math.max(0,wd-ex),rank=rankAt(new Date(Y,M,1)),base=+S.pay[rank]||0,meal=(+S.meal||0)*days,tr=(+S.trans||0)*days,
extras=S.extras.reduce(function(s,e){return s+(+e.amt||0)},0);
return{wd:wd,ex:ex,days:days,rank:rank,base:base,meal:meal,tr:tr,extras:extras,total:base+meal+tr+extras}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function home(){var s=pd(S.start),e=pd(S.end),t=today();
if(!s||!e||e<s)return '<h1>지하철 복무 현황</h1><div class="card"><div class="empty">설정 탭에서 복무 시작일과 소집해제일을 입력하세요.</div></div>';
var tot=Math.round((e-s)/864e5)+1,done=Math.min(tot,Math.max(0,Math.round((t-s)/864e5)+1)),pct=done/tot*100,left=tot-done,r=rankAt(t);
var stops=[["입소",s,0]];["일병","상병","병장"].forEach(function(k){var p=pd(S.promo[k]);if(p&&p>=s&&p<=e)stops.push([k,p,(Math.round((p-s)/864e5))/tot*100])});stops.push(["해제",e,100]);
var st=stops.map(function(x){return '<div class="stop'+(t>=x[1]?' on':'')+(x[2]<=0?' l0':x[2]>=100?' l1':'')+'" style="left:'+x[2]+'%"><span>'+x[0]+'</span><small>'+(x[1].getMonth()+1)+'/'+x[1].getDate()+'</small></div>'}).join("");
var nx=null;["일병","상병","병장"].forEach(function(k){var p=pd(S.promo[k]);if(p&&p>t&&!nx)nx=[k,p]});
var m=calcMonth(ymOf(t)),rem=(+S.annual||0)-usedAnnual();
return '<h1>지하철 복무 현황</h1><div class="card hero"><div class="sub">복무율</div><div class="big">'+pct.toFixed(2)+'%</div>'
+'<div class="track"><div class="fill" style="width:'+pct+'%"></div>'+st+'<div class="train" style="left:'+pct+'%"></div></div>'
+'<div class="row"><span>현재 계급</span><b>'+r+'</b></div><div class="row"><span>복무한 날</span><b>'+done+'일 / '+tot+'일</b></div>'
+'<div class="row"><span>남은 날</span><b>'+left+'일</b></div>'
+'<div class="row"><span>다음 진급</span><b>'+(nx?nx[0]+' · '+fd(nx[1])+' ('+Math.round((nx[1]-t)/864e5)+'일 후)':'-')+'</b></div></div>'
+'<div class="card"><h2>이번 달 예상 월급</h2><div class="big" style="font-size:32px">'+won(m.total)+'</div><div class="sub">'+m.rank+' 기준 · 근무일 '+m.days+'일</div></div>'
+'<div class="card"><h2>남은 연가</h2><div class="big" style="font-size:32px">'+(Math.round(rem*10)/10)+'일</div><div class="sub">총 '+(+S.annual||0)+'일 중 '+usedAnnual()+'일 사용</div></div>'}

function pay(){var m=calcMonth(ym);
return '<h1>월급 계산</h1><div class="card"><label for="ym" style="margin-top:0">계산할 달</label><input id="ym" type="month" value="'+ym+'" onchange="ym=this.value||ym;render()"></div>'
+'<div class="card"><h2>'+ym.replace("-","년 ")+'월 · '+m.rank+'</h2>'
+'<div class="row"><span>기본급</span><b>'+won(m.base)+'</b></div>'
+'<div class="row"><span>식비 <span class="sub">('+m.days+'일)</span></span><b>'+won(m.meal)+'</b></div>'
+'<div class="row"><span>교통비 <span class="sub">('+m.days+'일)</span></span><b>'+won(m.tr)+'</b></div>'
+S.extras.map(function(e){return '<div class="row"><span>'+esc(e.name||"수당")+'</span><b>'+won(+e.amt||0)+'</b></div>'}).join("")
+'<div class="total"><span>합계</span><span>'+won(m.total)+'</span></div>'
+'<div class="note">평일 '+m.wd+'일 중 식비·교통비 제외 휴가 '+m.ex+'일을 뺐어요. 계급은 해당 월 1일 기준이에요.</div></div>'}

function leaves(){var rem=(+S.annual||0)-usedAnnual(),opts=S.types.map(function(t){return '<option>'+esc(t.n)+'</option>'}).join("");
var list=S.leaves.map(function(l,i){return {l:l,i:i}}).sort(function(a,b){return a.l.date<b.l.date?1:-1}).map(function(o){
return '<div class="row"><span>'+o.l.date+' <span class="pill">'+esc(o.l.type)+'</span> '+o.l.days+'일</span><button class="ghost" onclick="delLeave('+o.i+')" aria-label="휴가 삭제">삭제</button></div>'}).join("");
return '<h1>휴가 관리</h1><div class="card"><div class="sub">남은 연가</div><div class="big">'+(Math.round(rem*10)/10)+'일</div><div class="sub">총 '+(+S.annual||0)+'일 중 '+usedAnnual()+'일 사용</div></div>'
+'<div class="card"><h2>휴가 등록</h2><label for="ld" style="margin-top:0">날짜</label><input id="ld" type="date" value="'+dstr(today())+'">'
+'<div class="g2"><div><label for="lt">종류</label><select id="lt">'+opts+'</select></div><div><label for="ln">일수</label><input id="ln" type="number" inputmode="decimal" step="0.5" min="0.5" value="1"></div></div>'
+'<button class="btn" onclick="addLeave()">휴가 등록</button></div>'
+'<div class="card"><h2>사용 내역</h2>'+(list||'<div class="empty">아직 등록한 휴가가 없어요.</div>')+'</div>'}
function addLeave(){var d=document.getElementById("ld").value,t=document.getElementById("lt").value,n=parseFloat(document.getElementById("ln").value);
if(!d||!(n>0))return;S.leaves.push({date:d,type:t,days:n});save();render()}
function delLeave(i){S.leaves.splice(i,1);save();render()}

function numIn(id,lab,val,fn){return '<div><label for="'+id+'">'+lab+'</label><input id="'+id+'" type="number" inputmode="numeric" min="0" value="'+(+val||0)+'" onchange="'+fn+'"></div>'}
function settings(){
var promo=["일병","상병","병장"].map(function(k){return '<div><label for="p'+k+'">'+k+' 진급일</label><input id="p'+k+'" type="date" value="'+S.promo[k]+'" onchange="S.promo[\''+k+'\']=this.value;save()"></div>'}).join("");
var pays=RANKS.map(function(k){return numIn("b"+k,k+" 기본급(월)",S.pay[k],"S.pay['"+k+"']=+this.value;save()")}).join("");
var ex=S.extras.map(function(e,i){return '<div class="g2" style="grid-template-columns:1fr 1fr auto;align-items:end"><div><label for="en'+i+'">수당 이름</label><input id="en'+i+'" value="'+esc(e.name)+'" onchange="S.extras['+i+'].name=this.value;save()"></div>'
+'<div><label for="ea'+i+'">월 금액</label><input id="ea'+i+'" type="number" inputmode="numeric" min="0" value="'+(+e.amt||0)+'" onchange="S.extras['+i+'].amt=+this.value;save()"></div>'
+'<button class="ghost" onclick="S.extras.splice('+i+',1);save();render()" aria-label="수당 삭제">삭제</button></div>'}).join("");
var ty=S.types.map(function(t,i){return '<div class="row"><b>'+esc(t.n)+'</b><span style="display:flex;gap:14px"><label class="chk" style="margin:0"><input type="checkbox" '+(t.a?'checked':'')+' onchange="S.types['+i+'].a=this.checked;save()">연가 차감</label>'
+'<label class="chk" style="margin:0"><input type="checkbox" '+(t.x?'checked':'')+' onchange="S.types['+i+'].x=this.checked;save()">식비·교통비 제외</label></span></div>'}).join("");
return '<h1>설정</h1><div class="card"><h2>복무 기간</h2><div class="g2"><div><label for="s0" style="margin-top:0">복무 시작일</label><input id="s0" type="date" value="'+S.start+'" onchange="S.start=this.value;save()"></div>'
